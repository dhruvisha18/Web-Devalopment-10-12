<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo class</title>
    <style>
        a:link{
            color: navy;
        }
        a:visited{
            color: purple;
        }
        a:hover{
            color: green;
            font-size: 25px;
        }
        a:active{
            color: red;
        }
    </style>
</head>
<body>
    <h1>css link pseudo class</h1>
    <a href="htts://www.google.com/">google</a>
    <a href="htts://www.youtub.com/">youtub</a>
</body>
</html>
