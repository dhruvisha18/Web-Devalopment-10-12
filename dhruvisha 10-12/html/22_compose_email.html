<html>
    <head>
        <title>compose</title>
    </head>
    <body>
        <form action="success.html">
            <table cellpadding="10" border="1" align="center" width="50%">
                <tr>
                    <th bgcolor="yellow">compose email</th>
                </tr>
                <tr>
                    <td bgcolor="#eeeee">Email</td>
                </tr>
                <tr>
                    <td>
                        <input type="email" name="email" id="email">
                    </td>
                </tr>
                 <tr>
                    <td bgcolor="#eeeee">Subject</td>
                </tr>
                <tr>
                    <td>
                        <input type="text" name="subject" id="subject">
                    </td>
                </tr>
                 <tr>
                    <td bgcolor="#eeeee">Attachment</td>
                </tr>
                <tr>
                    <td>
                        <input type="file" name="Attachment" id="Attachment">
                    </td>
                </tr>
                 <tr>
                    <td bgcolor="#eeeee">Address</td>
                </tr>
                <tr>
                    <td>
                        <textarea name="Address" id="Address" row="5" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td align="center">
                        <button type="submit">send email</button>
                        <button type="reset">clear all</button>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
